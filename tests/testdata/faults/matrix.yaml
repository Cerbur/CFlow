# Release Fault Matrix (Task 21): every PRD fault scenario has a
# deterministic setup, an injected point, an expected Fault/disposition, a
# retry charge, a dispatch behavior, persistent evidence, and a recovery
# result. Each row is executable test data: the harness
# TestReleaseFaultMatrix (tests/integration/fault_matrix_test.go) runs one
# registered injector per row and FAILS when a row is unhandled (never a
# silent skip) or when the observed facts disagree with this table.
#
# Field contract (each row carries exactly these keys):
#   id                   stable row identity (asserted in failure text).
#   setup                named deterministic fixture ("v1_database",
#                        "registered_project", "artifact_store",
#                        "fake_supervisor", "provider_*", "clean_repo",
#                        "running_merge", "apply_attempt",
#                        "completed_workflow", "temp_home", "redactor").
#   inject               named fault injection point (must map to a
#                        registered harness injector; an unregistered
#                        point FAILS the harness listing the row id).
#   expected_code        the stable model Code of the produced Fault, a
#                        recovery Disposition outcome, or "" when the
#                        scenario settles without a Fault.
#   expected_disposition one Fault Category (INVALID_INPUT,
#                        RETRYABLE_ATTEMPT_FAILURE, USER_ACTION_REQUIRED,
#                        SAFETY_STOP, INVARIANT_FAILURE), a recovery
#                        Disposition (already_completed, safe_to_retry,
#                        blocked_drift, fatal_invariant), or a documented
#                        synthetic outcome (escalated, orphan_not_reaped,
#                        phantom_surfaced).
#   retry_charge         whether the failure charges the Node Retry Budget.
#   dispatch             open (dispatch stays open), closed (dispatch gate
#                        closed), or closed_until_reconciled (closed until
#                        the Recovery sweep settles the ledger).
#   evidence             the externally observable facts that must persist
#                        after the restart, named per row.
- id: migration_crash_before_backup_manifest
  setup: v1_database
  inject: migration_crash_before_manifest
  expected_code: DATABASE_MIGRATION_INCOMPLETE
  expected_disposition: INVARIANT_FAILURE
  retry_charge: false
  dispatch: closed
  evidence: [backup_preserved, db_untouched]
